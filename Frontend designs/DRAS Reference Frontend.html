<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRAS — Reference Frontend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #f0eee9; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="screens/landing.jsx"></script>
<script type="text/babel" src="screens/login.jsx"></script>
<script type="text/babel" src="screens/admin.jsx"></script>
<script type="text/babel" src="screens/camp.jsx"></script>
<script type="text/babel" src="screens/warehouse.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "role": "admin"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // apply theme to every dras-app artboard
  React.useEffect(() => {
    document.querySelectorAll('.dras-app').forEach(el => {
      el.setAttribute('data-theme', t.theme);
    });
  }, [t.theme]);

  // Build the role-driven dashboard for the "active role" artboard
  const RoleDashboard = t.role === "admin" ? AdminDashboard
                      : t.role === "camp"  ? CampDashboard
                      : WarehouseDashboard;

  return (
    <>
      <DesignCanvas>
        <DCSection
          id="public"
          title="Public surfaces"
          subtitle="Landing & sign-in — for the institute review and demo"
        >
          <DCArtboard id="landing" label="01 · Landing page" width={1280} height={900}>
            <div data-screen-label="01 Landing" data-theme={t.theme} style={{height: "100%"}}>
              <LandingPage />
            </div>
          </DCArtboard>
          <DCArtboard id="login" label="02 · Login" width={1280} height={820}>
            <div data-screen-label="02 Login" data-theme={t.theme} style={{height: "100%"}}>
              <LoginPage />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="dashboards"
          title="Role-based dashboards"
          subtitle="Three roles, one schema — switch the active role from Tweaks to mirror what each user sees"
        >
          <DCArtboard id="admin" label="03 · Control Admin · national overview" width={1440} height={960}>
            <div data-screen-label="03 Admin" data-theme={t.theme} style={{height: "100%"}}>
              <AdminDashboard />
            </div>
          </DCArtboard>
          <DCArtboard id="camp" label="04 · Camp Officer · raise & track requests" width={1440} height={960}>
            <div data-screen-label="04 Camp" data-theme={t.theme} style={{height: "100%"}}>
              <CampDashboard />
            </div>
          </DCArtboard>
          <DCArtboard id="warehouse" label="05 · Warehouse Manager · inventory & dispatch" width={1440} height={960}>
            <div data-screen-label="05 Warehouse" data-theme={t.theme} style={{height: "100%"}}>
              <WarehouseDashboard />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="active"
          title="Active role · live preview"
          subtitle="This artboard reflects the role currently selected in Tweaks"
        >
          <DCArtboard id="active-role" label={`Currently viewing · ${t.role}`} width={1440} height={960}>
            <div data-screen-label="Active role" data-theme={t.theme} style={{height: "100%"}}>
              <RoleDashboard />
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio
          label="Color theme"
          value={t.theme}
          options={[{value: "light", label: "Light"}, {value: "dark", label: "Dark"}]}
          onChange={(v) => setTweak('theme', v)}
        />
        <TweakSection label="Role switcher" />
        <TweakRadio
          label="Active role"
          value={t.role}
          options={[
            {value: "admin", label: "Admin"},
            {value: "camp", label: "Camp"},
            {value: "warehouse", label: "WH"},
          ]}
          onChange={(v) => setTweak('role', v)}
        />
        <div style={{fontSize: 10.5, color: "rgba(41,38,27,.5)", marginTop: 6, lineHeight: 1.45}}>
          The "Active role · live preview" artboard reflects this selection. The three role artboards above always show their own role.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
